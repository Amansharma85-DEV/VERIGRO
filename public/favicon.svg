<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="nirikshanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Rounded container background -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  
  <!-- Outer glowing ring / lens -->
  <circle cx="32" cy="32" r="22" stroke="url(#nirikshanGrad)" stroke-width="3" fill="none" opacity="0.4" />
  
  <!-- Inspection Scanner corners -->
  <path d="M 20 25 L 20 20 L 25 20" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 44 25 L 44 20 L 39 20" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 20 39 L 20 44 L 25 44" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 44 39 L 44 44 L 39 44" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Central Eye / Aperture Lens Symbol -->
  <path d="M 22 32 C 26 26, 38 26, 42 32 C 38 38, 26 38, 22 32 Z" fill="none" stroke="url(#nirikshanGrad)" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="4.5" fill="#10b981" />
  <circle cx="33.5" cy="30.5" r="1.5" fill="#ffffff" />
  
  <!-- Horizontal scan beam indicator -->
  <line x1="16" y1="32" x2="48" y2="32" stroke="url(#scanBeam)" stroke-width="2" />
</svg>
